<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优惠号卡办理中心</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
        }

        /* 整体布局：左右结构 */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 左侧侧边栏 */
        .sidebar {
            width: 220px;
            background-color: #1e293b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.15);
            z-index: 100;
            flex-shrink: 0;
        }

        /* 侧边栏标题栏 */
        .sidebar-header {
            padding: 20px 16px;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 侧边导航列表 */
        .nav-list {
            list-style: none;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 导航按钮 */
        .nav-item {
            width: 100%;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover {
            background-color: #334155;
            color: #f8fafc;
        }

        /* 选中状态 */
        .nav-item.active {
            background-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* 小圆点指示器 */
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: transparent;
            transition: background-color 0.25s ease;
        }

        .nav-item.active .dot {
            background-color: #ffffff;
        }

        /* 右侧内容展示区 */
        .main-content {
            flex: 1;
            height: 100%;
            position: relative;
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* 移动端响应式适配（屏幕较小是转换为顶部栏） */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
            }

            .sidebar-header {
                padding: 10px 16px;
                font-size: 16px;
            }

            .nav-list {
                flex-direction: row;
                padding: 6px;
                gap: 4px;
            }

            .nav-item {
                padding: 10px 8px;
                font-size: 13px;
                justify-content: center;
                text-align: center;
            }

            .dot {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span>📱 号卡办理中心</span>
            </div>
            <ul class="nav-list">
                <li>
                    <button class="nav-item active" onclick="switchTab(0)">
                        <span>号卡中心 1</span>
                        <span class="dot"></span>
                    </button>
                </li>
                <li>
                    <button class="nav-item" onclick="switchTab(1)">
                        <span>号卡中心 2</span>
                        <span class="dot"></span>
                    </button>
                </li>
                <li>
                    <button class="nav-item" onclick="switchTab(2)">
                        <span>号卡中心 3</span>
                        <span class="dot"></span>
                    </button>
                </li>
            </ul>
        </aside>

        <!-- 右侧内容区域 -->
        <main class="main-content">
            <!-- 链接 1：mlhaok -->
            <iframe id="iframe1" class="active" src="https://mlhaok.xruiz172.cn/home/c902fa27e49ded12" allow="geolocation"></iframe>
            
            <!-- 链接 2：ym3 -->
            <iframe id="iframe2" src="https://ym3.ksjhaoka.com/?s=fphsL5K6411798" allow="geolocation"></iframe>
            
            <!-- 链接 3：vip -->
            <iframe id="iframe3" src="https://vip.ksjhaoka.com/?s=fphsL5K6411798" allow="geolocation"></iframe>
        </main>
    </div>

    <script>
        function switchTab(index) {
            const btns = document.querySelectorAll('.nav-item');
            const iframes = document.querySelectorAll('iframe');

            btns.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                    iframes[i].classList.add('active');
                } else {
                    btn.classList.remove('active');
                    iframes[i].classList.remove('active');
                }
            });
        }
    </script>

</body>
</html>
