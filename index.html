<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* 整体布局 */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 左侧侧边栏 */
        .sidebar {
            width: 260px;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.15);
            z-index: 100;
            flex-shrink: 0;
            position: relative;
        }

        /* 左上角独立 Logo 容器卡片 */
        .brand-logo-card {
            margin: 16px;
            padding: 12px 14px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* 独立的 Logo 图标外框 */
        .logo-box {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .brand-sub {
            font-size: 9px;
            color: #38bdf8;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 2px;
            white-space: nowrap;
        }

        /* 导航组标题 */
        .nav-group-title {
            padding: 12px 20px 8px 20px;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 导航菜单列表 */
        .nav-list {
            list-style: none;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 导航按钮 */
        .nav-item {
            width: 100%;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* 选中高亮状态 */
        .nav-item.active {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            background-color: #1e293b;
            color: #94a3b8;
        }

        .nav-item.active .badge {
            background-color: #ffffff;
            color: #2563eb;
        }

        /* 底部服务提示 */
        .sidebar-footer {
            margin-top: auto;
            padding: 16px 16px 85px 16px;
            border-top: 1px solid #1e293b;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .sidebar-footer p {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 右侧主要区域 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }

        /* 顶部通告栏 */
        .top-banner {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 10px 20px;
            font-size: 13px;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-banner .tips {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .open-external-btn {
            font-size: 12px;
            color: #2563eb;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .open-external-btn:hover {
            background-color: #dbeafe;
        }

        /* 内容 iframe 容器 */
        .content-area {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* ================= 左下角 AI 客服组件 ================= */
        .ai-chat-widget {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 99999;
            font-family: inherit;
        }

        .ai-chat-toggle-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }

        .ai-chat-toggle-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.5);
        }

        .ai-chat-toggle-btn .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .ai-chat-window {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 420px;
            height: 560px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(226, 232, 240, 0.9);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ai-chat-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .ai-title { font-size: 15px; font-weight: 700; }
        .ai-status { font-size: 11px; color: #38bdf8; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .ai-status-dot { width: 6px; height: 6px; background-color: #4ade80; border-radius: 50%; }

        .ai-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .ai-close-btn:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }

        .ai-chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message-bubble.bot {
            align-self: flex-start;
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-top-left-radius: 3px;
        }

        .message-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border-top-right-radius: 3px;
        }

        .quick-prompts {
            padding: 8px 16px 12px 16px;
            background-color: #f8fafc;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-top: 1px dashed #e2e8f0;
        }

        .prompt-chip {
            white-space: nowrap;
            padding: 6px 12px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            font-size: 12px;
            color: #0284c7;
            cursor: pointer;
        }

        .prompt-chip:hover { background-color: #f0f9ff; border-color: #0284c7; }

        .ai-chat-input-area {
            padding: 12px 16px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-chat-input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 13.5px;
            outline: none;
        }

        .ai-chat-input:focus { border-color: #2563eb; }

        .ai-send-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .brand-logo-card { margin: 8px 12px; padding: 8px 10px; }
            .logo-box { width: 36px; height: 36px; }
            .nav-group-title, .sidebar-footer, .top-banner { display: none; }
            .nav-list { flex-direction: row; padding: 0 12px 8px 12px; gap: 6px; overflow-x: auto; }
            .nav-item { padding: 8px 12px; font-size: 13px; white-space: nowrap; }
            .ai-chat-widget { bottom: 15px; left: 15px; }
            .ai-chat-window { width: calc(100vw - 30px); height: 480px; bottom: 55px; }
        }
    </style>
</head>

    <script>
        const targetUrls = [
            "https://mlhaok.xruiz172.cn/home/c902fa27e49ded12",
            "https://ym3.ksjhaoka.com/?s=fphsL5K6411798",
            "https://vip.ksjhaoka.com/?s=fphsL5K6411798"
        ];

        // Tab 切换逻辑 (纯 iframe 方案)
        function switchTab(index) {
            const btns = document.querySelectorAll('.nav-item');
            const iframes = document.querySelectorAll('iframe');
            const externalBtn = document.getElementById('externalLinkBtn');

            btns.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                    iframes[i].classList.add('active');
                    if(externalBtn) externalBtn.href = targetUrls[i];
                } else {
                    btn.classList.remove('active');
                    iframes[i].classList.remove('active');
                }
            });
        }

        // 开关 AI 聊天窗口
        function toggleChatWindow() {
            const win = document.getElementById('aiChatWindow');
            const btnText = document.getElementById('toggleBtnText');
            
            const currentDisplay = window.getComputedStyle(win).display;
            
            if (currentDisplay === 'none') {
                win.style.display = 'flex';
                if(btnText) btnText.innerText = '✕ 关闭客服';
            } else {
                win.style.display = 'none';
                if(btnText) btnText.innerText = '🤖 AI 智能客服';
            }
        }
