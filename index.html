<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速流动云 - SPEED FLOW CLOUD 号卡服务平台</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* 整体布局 */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 左侧侧边栏 */
        .sidebar {
            width: 250px;
            background-color: #0f172a; /* 深蓝色背景匹配品牌 */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.15);
            z-index: 100;
            flex-shrink: 0;
        }

        /* Logo 区域 */
        .brand-header {
            padding: 20px 16px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 8px;
            background-color: #ffffff;
            padding: 2px;
        }

        .brand-title-box {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .brand-sub {
            font-size: 9px;
            color: #38bdf8;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* 导航组标题 */
        .nav-group-title {
            padding: 16px 20px 8px 20px;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 导航菜单列表 */
        .nav-list {
            list-style: none;
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 导航按钮 */
        .nav-item {
            width: 100%;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* 选中高亮状态（采用 Logo 同款蓝色渐变） */
        .nav-item.active {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            background-color: #1e293b;
            color: #94a3b8;
        }

        .nav-item.active .badge {
            background-color: #ffffff;
            color: #2563eb;
        }

        /* 底部服务提示 */
        .sidebar-footer {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid #1e293b;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .sidebar-footer p {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 右侧主要区域 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }

        /* 顶部通告栏 */
        .top-banner {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 10px 20px;
            font-size: 13px;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-banner .tips {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-banner .tip-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 内容 iframe 容器 */
        .content-area {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* 移动端响应式 */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
            }

            .brand-header {
                padding: 10px 16px;
            }

            .brand-logo-img {
                width: 32px;
                height: 32px;
            }

            .nav-group-title, .sidebar-footer, .top-banner {
                display: none;
            }

            .nav-list {
                flex-direction: row;
                padding: 8px;
                gap: 6px;
                overflow-x: auto;
            }

            .nav-item {
                padding: 8px 12px;
                font-size: 13px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <!-- 极速流动云 品牌 Header -->
            <div class="brand-header">
                <img src="1793176245289.jpg" alt="极速流动云 Logo" class="brand-logo-img">
                <div class="brand-title-box">
                    <span class="brand-name">极速流动云</span>
                    <span class="brand-sub">SPEED FLOW CLOUD</span>
                </div>
            </div>

            <div class="nav-group-title">号卡办理中心</div>
            <ul class="nav-list">
                <li>
                    <button class="nav-item active" onclick="switchTab(0)">
                        <span>🔥 爆款特惠卡</span>
                        <span class="badge">推荐</span>
                    </button>
                </li>
                <li>
                    <button class="nav-item" onclick="switchTab(1)">
                        <span>⚡ 快速办理通道</span>
                        <span class="badge">直连</span>
                    </button>
                </li>
                <li>
                    <button class="nav-item" onclick="switchTab(2)">
                        <span>👑 VIP 专属选号</span>
                        <span class="badge">精品</span>
                    </button>
                </li>
            </ul>

            <div class="sidebar-footer">
                <p>☁️ 极速流动云 官方服务</p>
                <p>✅ 运营商直发 包邮到家</p>
                <p>✅ 官方10010/10000可查</p>
            </div>
        </aside>

        <!-- 右侧展示区域 -->
        <div class="main-wrapper">
            <!-- 顶部服务保证说明栏 -->
            <div class="top-banner">
                <div class="tips">
                    <span class="tip-item">📢 欢迎来到极速流动云！请填写本人真实姓名及身份证选号办理，京东/顺丰包邮！</span>
                </div>
                <div class="tips">
                    <span class="tip-item">🛡️ 正规号卡</span>
                    <span class="tip-item">🚀 随时注销</span>
                </div>
            </div>

            <!-- 网页内容嵌套 -->
            <div class="content-area">
                <!-- 1. mlhaok 链接 -->
                <iframe id="iframe1" class="active" src="https://mlhaok.xruiz172.cn/home/c902fa27e49ded12" allow="geolocation"></iframe>
                
                <!-- 2. ym3 链接 -->
                <iframe id="iframe2" src="https://ym3.ksjhaoka.com/?s=fphsL5K6411798" allow="geolocation"></iframe>
                
                <!-- 3. vip 链接 -->
                <iframe id="iframe3" src="https://vip.ksjhaoka.com/?s=fphsL5K6411798" allow="geolocation"></iframe>
            </div>
        </div>
    </div>

    <script>
        function switchTab(index) {
            const btns = document.querySelectorAll('.nav-item');
            const iframes = document.querySelectorAll('iframe');

            btns.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                    iframes[i].classList.add('active');
                } else {
                    btn.classList.remove('active');
                    iframes[i].classList.remove('active');
                }
            });
        }
    </script>

</body>
</html>
