<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极速流动云 - SPEED FLOW CLOUD 号卡服务平台</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            overflow-x: hidden;
        }

        /* 整体布局容器：允许全页滚动，确保底部绝对可见 */
        .app-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* 左侧侧边栏 */
        .sidebar {
            width: 260px;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.15);
            z-index: 100;
            flex-shrink: 0;
        }

        /* 左上角独立 Logo 容器卡片 */
        .brand-logo-card {
            margin: 16px;
            padding: 12px 14px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .logo-box {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text-box {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .brand-sub {
            font-size: 9px;
            color: #38bdf8;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 2px;
            white-space: nowrap;
        }

        .nav-group-title {
            padding: 12px 20px 8px 20px;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-list {
            list-style: none;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            width: 100%;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-item:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            background-color: #1e293b;
            color: #94a3b8;
        }

        .nav-item.active .badge {
            background-color: #ffffff;
            color: #2563eb;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px;
            border-top: 1px solid #1e293b;
            font-size: 11.5px;
            color: #94a3b8;
            line-height: 1.5;
            background-color: #0f172a;
        }

        .service-tips p {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        /* 右侧主要区域 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f8fafc;
        }

        .top-banner {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 20px;
            font-size: 13px;
            color: #475569;
            flex-shrink: 0;
        }

        /* 內容 iframe 區域 (高度固定，保證正常操作) */
        .content-area {
            width: 100%;
            height: calc(100vh - 45px - 45px); /* 扣除顶部通告栏与底部版权栏的高度 */
            min-height: 500px;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ================= 底部独立版权与备案栏（强制在最下方独立展现） ================= */
        .global-footer {
            height: 45px;
            background-color: #0f172a;
            color: #94a3b8;
            border-top: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            gap: 15px;
            flex-shrink: 0;
            width: 100%;
        }

        .global-footer a {
            color: #38bdf8;
            text-decoration: none;
        }

        .global-footer a:hover {
            text-decoration: underline;
        }

        /* ================= 左下角 AI 客服组件 ================= */
        .ai-chat-widget {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 2147483647;
            font-family: inherit;
        }

        .ai-chat-toggle-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }

        .ai-chat-toggle-btn:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .ai-chat-toggle-btn .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .ai-chat-window {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 420px;
            height: 560px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35);
            border: 1px solid rgba(226, 232, 240, 0.9);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .ai-chat-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-chat-header-info { display: flex; align-items: center; gap: 12px; }
        .ai-avatar { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .ai-title { font-size: 15px; font-weight: 700; }
        .ai-status { font-size: 11px; color: #38bdf8; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .ai-status-dot { width: 6px; height: 6px; background-color: #4ade80; border-radius: 50%; }

        .ai-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .ai-chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message-bubble.bot { align-self: flex-start; background: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; border-top-left-radius: 3px; }
        .message-bubble.user { align-self: flex-end; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; border-top-right-radius: 3px; }

        .quick-prompts {
            padding: 8px 16px 12px 16px;
            background-color: #f8fafc;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-top: 1px dashed #e2e8f0;
        }

        .prompt-chip {
            white-space: nowrap;
            padding: 6px 12px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            font-size: 12px;
            color: #0284c7;
            cursor: pointer;
        }

        .ai-chat-input-area {
            padding: 12px 16px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-chat-input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 13.5px;
            outline: none;
        }

        .ai-send-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .brand-logo-card { margin: 8px 12px; padding: 8px 10px; }
            .logo-box { width: 36px; height: 36px; }
            .nav-group-title, .sidebar-footer, .top-banner, .global-footer { display: none; }
            .nav-list { flex-direction: row; padding: 0 12px 8px 12px; gap: 6px; overflow-x: auto; }
            .nav-item { padding: 8px 12px; font-size: 13px; white-space: nowrap; }
            .ai-chat-widget { bottom: 15px; left: 15px; }
            .ai-chat-window { width: calc(100vw - 30px); height: 480px; bottom: 55px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="brand-logo-card">
                <div class="logo-box">
                    <img src="image/1793176245289.jpg" alt="极速流动云 Logo" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div style="display:none; width:100%; height:100%; background:linear-gradient(135deg, #2563eb, #4f46e5); color:#fff; align-items:center; justify-content:center; font-weight:bold; font-size:18px;">极</div>
                </div>
                <div class="brand-text-box">
                    <span class="brand-name">极速流动云</span>
                    <span class="brand-sub">SPEED FLOW CLOUD</span>
                </div>
            </div>

            <div class="nav-group-title">号卡办理中心</div>
            <ul class="nav-list">
                <li>
                    <button class="nav-item active" onclick="switchTab(0)">
                        <span>🔥 爆款特惠卡</span>
                        <span class="badge">推荐</span>
                    </button>
                </li>
                <li>
                    <button class="nav-item" onclick="switchTab(1)">
                        <span>⚡ 快速办理通道 ↗</span>
                        <span class="badge">直连</span>
                    </button>
                </li>
                <li>
                    <button class="nav-item" onclick="switchTab(2)">
                        <span>👑 VIP 专属选号 ↗</span>
                        <span class="badge">精品</span>
                    </button>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="service-tips">
                    <p>☁️ 官方直发 包邮到家</p>
                    <p>✅ 官方10010/10000可查</p>
                </div>
            </div>
        </aside>

        <!-- 右侧主要区域 -->
        <main class="main-wrapper">
            <div class="top-banner">
                <span>📢 欢迎来到极速流动云！请填写本人真实姓名及身份证选号办理，京东/顺丰包邮！</span>
            </div>

            <div class="content-area">
                <iframe id="iframe1" class="active" src="https://mlhaok.xruiz172.cn/home/c902fa27e49ded12"></iframe>
            </div>

            <!-- 📌 绝对可见的独立底部版权与备案栏 -->
            <footer class="global-footer">
                <span>Copyright © 2026 极速流动云 版权所有</span>
                <span>|</span>
                <a href="https://beian.miit.gov.cn/" target="_blank">京ICP备XXXXXXXX号</a>
            </footer>
        </main>
    </div>

    <!-- 左下角 AI 客服组件 -->
    <div class="ai-chat-widget">
        <button class="ai-chat-toggle-btn" id="aiToggleBtn" onclick="toggleChatWindow()" type="button">
            <span class="pulse-dot"></span>
            <span id="toggleBtnText">🤖 AI 智能客服</span>
        </button>

        <div class="ai-chat-window" id="aiChatWindow">
            <div class="ai-chat-header">
                <div class="ai-chat-header-info">
                    <div class="ai-avatar">🤖</div>
                    <div>
                        <div class="ai-title">极速流动云 AI 助手</div>
                        <div class="ai-status">
                            <span class="ai-status-dot"></span>
                            <span>全天候在线为您解答</span>
                        </div>
                    </div>
                </div>
                <button class="ai-close-btn" onclick="toggleChatWindow()" type="button">✕</button>
            </div>

            <div class="ai-chat-messages" id="chatMessages">
                <div class="message-bubble bot">
                    您好！我是极速流动云 AI 智能客服 👋<br>请问关于号卡套餐、办理进度、发货快递、首充激活或注销变更，有什么可以帮您的？
                </div>
            </div>

            <div class="quick-prompts">
                <div class="prompt-chip" onclick="sendQuickPrompt('📢 办卡需要多长时间？')">📢 办卡要多久</div>
                <div class="prompt-chip" onclick="sendQuickPrompt('🚚 发什么快递？')">🚚 发什么快递</div>
                <div class="prompt-chip" onclick="sendQuickPrompt('⚡ 如何激活号卡？')">⚡ 如何激活</div>
                <div class="prompt-chip" onclick="sendQuickPrompt('🔍 怎么查询订单？')">🔍 订单查询</div>
            </div>

            <div class="ai-chat-input-area">
                <input type="text" id="chatInput" class="ai-chat-input" placeholder="请输入您想咨询的问题..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="ai-send-btn" onclick="sendMessage()" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const externalUrls = [
            "https://mlhaok.xruiz172.cn/home/c902fa27e49ded12",
            "https://ym3.ksjhaoka.com/?s=fphsL5K6411798",
            "https://vip.ksjhaoka.com/?s=fphsL5K6411798"
        ];

        function switchTab(index) {
            if (index === 0) {
                document.querySelectorAll('.nav-item').forEach((btn, i) => btn.classList.toggle('active', i === 0));
                document.getElementById('iframe1').classList.add('active');
            } else {
                window.open(externalUrls[index], '_blank');
            }
        }

        function toggleChatWindow() {
            const win = document.getElementById('aiChatWindow');
            const btnText = document.getElementById('toggleBtnText');
            
            if (win.style.display === 'flex') {
                win.style.display = 'none';
                if(btnText) btnText.innerText = '🤖 AI 智能客服';
            } else {
                win.style.display = 'flex';
                if(btnText) btnText.innerText = '✕ 关闭客服';
            }
        }

        function sendQuickPrompt(text) {
            const input = document.getElementById('chatInput');
            if (input) {
                input.value = text;
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const messagesContainer = document.getElementById('chatMessages');
            if (!input || !messagesContainer) return;
            
            const text = input.value.trim();
            if (!text) return;

            const userBubble = document.createElement('div');
            userBubble.className = 'message-bubble user';
            userBubble.innerText = text;
            messagesContainer.appendChild(userBubble);

            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            setTimeout(() => {
                const botBubble = document.createElement('div');
                botBubble.className = 'message-bubble bot';
                
                let reply = '感谢您的咨询！极速流动云所有的号卡均为运营商直发正规卡。若有订单查询需求，可在选号办理页面点击“订单查询”查看详情。';
                
                if (text.includes('多久') || text.includes('时间') || text.includes('发货')) {
                    reply = '⏱️ 下单后运营商会在 24 小时内完成审核并发货，一般 2-3 天即可送达您的家中。';
                } else if (text.includes('快递')) {
                    reply = '🚚 系统会根据您的配送地址，随机安排京东快递或顺丰速运免费包邮送到家。';
                } else if (text.includes('激活')) {
                    reply = '⚡ 绝大多数号卡随卡附带激活说明书，支持微信扫码或在线自主激活，也有部分由快递员现场协助面对面激活。';
                } else if (text.includes('查询') || text.includes('订单')) {
                    reply = '🔍 请在号卡中心页面顶部或菜单中点击“订单查询”，输入下单时填写的手机号与身份证后四位即可实时查询物流状态。';
                }

                botBubble.innerHTML = reply;
                messagesContainer.appendChild(botBubble);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
